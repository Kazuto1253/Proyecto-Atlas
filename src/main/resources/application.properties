spring.application.name=atlas
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# ===== Base de datos SQLite =====
spring.datasource.url=jdbc:sqlite:${user.home}/.atlas/atlas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Registro de actividad: consola + archivo =====
logging.file.name=${user.home}/.atlas/logs/atlas.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.level.root=WARN
logging.level.pe.upeu.atlas=INFO

# ===== Datos de prueba =====
app.seeder.enabled=true

# ===== Atlas =====
app.atlas.directorio-base=${user.home}/.atlas
app.atlas.directorio-modelos=${app.atlas.directorio-base}/modelos
app.atlas.idioma=es
# CLARO | OSCURO
app.atlas.tema=CLARO
app.atlas.carpeta-capturas=${user.home}/Im\u00e1genes/Atlas
app.atlas.carpetas-permitidas=${user.home}/Documentos,${user.home}/Descargas,${user.home}/Escritorio,${user.home}/Im\u00e1genes,${user.home}/Documents,${user.home}/Downloads,${user.home}/Desktop,${user.home}/Pictures
app.atlas.modo-solo-lectura=false
app.atlas.atajo=Ctrl+Espacio

# LLM local (Ollama)
app.atlas.llm.url=http://localhost:11434
app.atlas.llm.modelo=qwen2.5:3b
app.atlas.llm.modelo-embeddings=nomic-embed-text
# Opcional: deja vacio para desactivar "describir la pantalla"
app.atlas.llm.modelo-vision=qwen2.5vl:3b
app.atlas.llm.temperatura=0.3
app.atlas.llm.tiempo-espera-segundos=120
app.atlas.llm.mensajes-memoria=20

# Voz
app.atlas.voz.modelo-vosk=${app.atlas.directorio-modelos}/vosk/vosk-model-small-es-0.42
app.atlas.voz.ejecutable-piper=${app.atlas.directorio-modelos}/piper/piper
app.atlas.voz.voz-piper=${app.atlas.directorio-modelos}/voces/es_ES-davefx-medium.onnx
app.atlas.voz.frecuencia-muestreo=16000
# Umbral de silencio: 0 = automatico (se adapta al ruido de tu microfono). Un valor fijo, p. ej. 500, lo desactiva.
app.atlas.voz.umbral-silencio=0
# Parte del nombre del microfono a usar (vacio = el predeterminado de Windows)
app.atlas.voz.microfono=
# Amplificacion maxima automatica de tu voz (microfonos muy bajos necesitan mas)
app.atlas.voz.ganancia-maxima=3.5
# Si la confianza del reconocimiento es menor, el texto se coloca en el cuadro para que lo corrijas antes de enviarlo
app.atlas.voz.confianza-minima=0.6
# Reconocedor de comandos de vocabulario acotado (abrir carpetas, volumen, hora, etc.)
app.atlas.voz.usar-comandos=true
# Whisper: reconoce las frases libres con mucha mas precision que Vosk (opcional; si no existe se usa solo Vosk)
app.atlas.voz.usar-whisper=true
app.atlas.voz.whisper-ejecutable=${app.atlas.directorio-modelos}/whisper/bin/Release/whisper-cli.exe
app.atlas.voz.whisper-modelo=${app.atlas.directorio-modelos}/whisper/ggml-base.bin
app.atlas.voz.whisper-hilos=4
# true = guarda la ultima grabacion en ~/.atlas/voz-debug/ultima.wav para diagnosticar problemas
app.atlas.voz.guardar-audio-depuracion=false
app.atlas.voz.milisegundos-silencio=1200
app.atlas.voz.segundos-maximos-frase=15
app.atlas.voz.palabra-activacion=oye atlas

# OCR (Tesseract via Tess4J)
app.atlas.ocr.directorio-tessdata=${app.atlas.directorio-modelos}/tessdata
app.atlas.ocr.idioma=spa
