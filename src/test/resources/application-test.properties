# Base de datos en memoria: las pruebas no tocan ~/.atlas/atlas.db
spring.datasource.url=jdbc:sqlite:file:atlas-test?mode=memory&cache=shared
spring.jpa.hibernate.ddl-auto=create-drop
app.seeder.enabled=false
logging.file.name=
# Carpetas temporales: las pruebas no crean nada en el home del usuario
app.atlas.directorio-base=${java.io.tmpdir}/atlas-test
app.atlas.carpeta-capturas=${java.io.tmpdir}/atlas-test/capturas
